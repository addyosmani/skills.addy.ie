<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Geist, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#000"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.03" stroke-width="1"/></pattern>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3" fill="none" stroke="#3ed6c5" stroke-width="1.5"/></marker>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3" fill="none" stroke="#565656" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/><rect width="1280" height="720" fill="url(#grid)"/>

  <g transform="translate(64,58)">
    <path d="M2 8 18 0l16 8v16l-16 8-16-8V8Z" fill="none" stroke="#52a8ff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M18 0v32M2 8l16 8 16-8" fill="none" stroke="#52a8ff" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
    <text x="48" y="23" font-size="22" font-weight="600" fill="#fff">agent<tspan fill="#7d7d7d">-skills</tspan></text>
  </g>
  <text x="64" y="148" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#fff">Agents run the inner loop. You own the outer loop.</text>
  <text x="64" y="189" font-size="20" fill="#a1a1a1">The boundary between them is evidence. Skills are what make that evidence trustworthy.</text>

  <!-- INNER LOOP -->
  <g transform="translate(64,232)">
    <rect x="0" y="0" width="560" height="404" rx="16" fill="#0b0f0e" stroke="#3ed6c5" stroke-opacity="0.35"/>
    <text x="28" y="42" font-family="'Geist Mono',monospace" font-size="13" letter-spacing="3" fill="#3ed6c5">INNER LOOP · THE AGENT</text>
    <text x="28" y="68" font-size="15" fill="#7d7d7d">Investigate, implement, verify, repeat</text>

    <!-- cycle nodes -->
    <g font-size="15" fill="#ededed" text-anchor="middle">
      <g transform="translate(280,150)">
        <rect x="-92" y="-26" width="184" height="52" rx="10" fill="#0e0e0e" stroke="#2e2e2e"/>
        <text y="5">Investigate</text>
      </g>
      <g transform="translate(430,250)">
        <rect x="-92" y="-26" width="184" height="52" rx="10" fill="#0e0e0e" stroke="#2e2e2e"/>
        <text y="5">Implement</text>
      </g>
      <g transform="translate(130,250)">
        <rect x="-92" y="-26" width="184" height="52" rx="10" fill="#0e0e0e" stroke="#3ed6c5" stroke-opacity="0.5"/>
        <text y="5">Verify</text>
      </g>
    </g>
    <!-- cycle arrows -->
    <g fill="none" stroke="#3ed6c5" stroke-opacity="0.7" stroke-width="1.6">
      <path d="M330 168 C 392 190, 410 205, 418 222" marker-end="url(#ar)"/>
      <path d="M338 262 C 300 280, 262 280, 224 268" marker-end="url(#ar)"/>
      <path d="M120 224 C 150 190, 180 172, 210 160" marker-end="url(#ar)"/>
    </g>

    <!-- skills band -->
    <rect x="28" y="318" width="504" height="60" rx="10" fill="#0e0e0e" stroke="#2e2e2e"/>
    <text x="44" y="344" font-family="'Geist Mono',monospace" font-size="12" fill="#52a8ff">SKILLS RUN HERE</text>
    <text x="44" y="366" font-size="13.5" fill="#a1a1a1">/spec · /test · /review · anti-rationalization + verification gates</text>
  </g>

  <!-- EVIDENCE boundary -->
  <g transform="translate(624,232)">
    <line x1="30" y1="0" x2="30" y2="404" stroke="#2e2e2e" stroke-dasharray="4 6"/>
    <g transform="translate(0,180)">
      <rect x="-2" y="0" width="64" height="120" rx="8" fill="#0e0e0e" stroke="#52a8ff" stroke-opacity="0.4"/>
      <text x="30" y="26" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="10.5" letter-spacing="1" fill="#52a8ff">EVIDENCE</text>
      <text x="30" y="52" text-anchor="middle" font-size="11" fill="#a1a1a1">diffs</text>
      <text x="30" y="72" text-anchor="middle" font-size="11" fill="#a1a1a1">tests</text>
      <text x="30" y="92" text-anchor="middle" font-size="11" fill="#a1a1a1">logs</text>
    </g>
    <path d="M14 240 H -20" fill="none" stroke="#565656" stroke-width="1.6" marker-end="url(#arw)"/>
    <path d="M62 240 H 96" fill="none" stroke="#565656" stroke-width="1.6" marker-end="url(#arw)"/>
  </g>

  <!-- OUTER LOOP -->
  <g transform="translate(742,232)">
    <rect x="0" y="0" width="474" height="404" rx="16" fill="#0c0d12" stroke="#52a8ff" stroke-opacity="0.35"/>
    <text x="28" y="42" font-family="'Geist Mono',monospace" font-size="13" letter-spacing="3" fill="#52a8ff">OUTER LOOP · YOU</text>
    <text x="28" y="68" font-size="15" fill="#7d7d7d">Decide, verify, approve, own</text>

    <g font-size="14">
      <g transform="translate(28,96)">
        <rect width="418" height="52" rx="10" fill="#0e0e0e" stroke="#2e2e2e"/>
        <text x="18" y="24" fill="#ededed">Constraints</text><text x="18" y="42" fill="#7d7d7d" font-size="12">inputs, architecture, invariants</text>
      </g>
      <g transform="translate(28,158)">
        <rect width="418" height="52" rx="10" fill="#0e0e0e" stroke="#2e2e2e"/>
        <text x="18" y="24" fill="#ededed">Sampling</text><text x="18" y="42" fill="#7d7d7d" font-size="12">how much output you read and review</text>
      </g>
      <g transform="translate(28,220)">
        <rect width="418" height="52" rx="10" fill="#0e0e0e" stroke="#2e2e2e"/>
        <text x="18" y="24" fill="#ededed">Audit</text><text x="18" y="42" fill="#7d7d7d" font-size="12">what evidence you keep and can explain</text>
      </g>
      <g transform="translate(28,282)">
        <rect width="418" height="76" rx="10" fill="#0e0e0e" stroke="#4fd873" stroke-opacity="0.5"/>
        <text x="18" y="28" fill="#fff" font-weight="600" font-size="16">Verdict</text>
        <text x="18" y="52" fill="#a1a1a1" font-size="12.5">ship · block · redirect · narrow · reject</text>
        <text x="18" y="70" fill="#7d7d7d" font-size="12">you carry the consequences of being wrong</text>
      </g>
    </g>
  </g>

  <!-- back-pressure note -->
  <text x="64" y="684" font-family="'Geist Mono',monospace" font-size="14" fill="#565656">Back pressure: grant only as much autonomy as you can cheaply and reliably verify.</text>
  <text x="1216" y="684" text-anchor="end" font-family="'Geist Mono',monospace" font-size="14" fill="#a1a1a1">skills.addy.ie/loops</text>
</svg>
